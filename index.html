<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3e9" />
    <meta name="description" content="A little world, shaped by you. An isometric god-game sandbox inspired by Populous." />
    <title>Tidelands — A little world, shaped by you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <a class="brand" href="./" aria-label="Tidelands home"><span class="brand-mark">≋</span><span>tidelands<span class="brand-dot">.</span></span></a>
        <button id="new-world" class="text-button"><span data-icon="refresh"></span> New world</button>
      </header>
      <main id="world">
        <canvas id="scene" aria-label="Interactive isometric island. Point at a corner, or hold Shift to select a surface. Left-click to raise, right-click to lower, drag to pan, middle-drag to orbit, arrow keys to pan, scroll to zoom."></canvas>
        <div class="scene-grain"></div>
        <section class="world-stats" aria-label="Population and power"><div class="stat"><span class="stat-icon" data-icon="people"></span><div><span class="stat-label">POPULATION</span><strong id="population">24 <small>settlers</small></strong></div></div><span class="stat-divider"></span><div class="stat"><span class="stat-icon" data-icon="power"></span><div><span class="stat-label">POWER</span><strong id="power" title="Start with 10,000 power. Terrain costs 1 power per affected point. Buildings generate power every 5 simulation seconds.">10,000</strong></div></div></section>
        <aside class="toolbox"><div class="toolbox-label">SHAPE</div><button class="tool active" data-tool="raise" title="Raise land (1)"><span data-icon="raise"></span><span>Raise</span><kbd>1</kbd></button><button class="tool" data-tool="lower" title="Lower land (2)"><span data-icon="lower"></span><span>Lower</span><kbd>2</kbd></button><div class="tool-separator"></div><button class="tool" data-tool="inspect" title="Inspect tile (3)"><span data-icon="inspect"></span><span>Inspect</span><kbd>3</kbd></button></aside>
        <div class="compass" aria-label="North direction"><div class="compass-n">N</div><svg width="52" height="52" viewBox="0 0 52 52"><path d="M26 7 34 32 26 27 18 32Z" fill="#4a7068"/><path d="m26 27 8 5-8 13-8-13Z" fill="#fff" opacity=".8"/></svg></div>
        <aside class="spellbox" aria-label="Spells"><div class="toolbox-label">SPELLS</div><button class="spell" data-spell="earthquake" aria-label="Select Earthquake, 500 power" aria-describedby="earthquake-tooltip"><span data-icon="earthquake"></span><span class="spell-tooltip" id="earthquake-tooltip" role="tooltip"><strong>Earthquake</strong><small>500 power</small></span></button><button class="spell" data-spell="mountain" aria-label="Select Mountain, 2000 power" aria-describedby="mountain-tooltip"><span data-icon="mountain"></span><span class="spell-tooltip" id="mountain-tooltip" role="tooltip"><strong>Mountain</strong><small>2,000 power</small></span></button></aside>
        <div id="tile-info" class="tile-info" hidden></div>
        <div id="toast" class="toast" role="status"></div>
        <div class="bottom-bar"><div class="tool-hint"><span class="hint-icon" data-icon="mouse"></span><span id="tool-hint"><strong>Raise a corner</strong><span class="hint-detail">Left raises · Right lowers · Shift selects surface</span></span></div><div class="playback"><button id="pause" class="icon-button" title="Pause simulation (Space)" aria-label="Pause simulation"><span data-icon="pause"></span></button><div class="speed-buttons"><button class="selected" data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div><span class="playback-divider"></span><button id="reset-view" class="icon-button" title="Reset camera" aria-label="Reset camera"><span data-icon="focus"></span></button></div></div>
        <div class="navigation-hint"><span>Drag or ↑ ↓ ← → to pan</span><i>·</i><span>Middle-drag to orbit</span><i>·</i><span>Scroll to zoom</span></div>
        <div id="loading"><span class="brand-mark">≋</span><p>A world is taking shape…</p></div>
      </main>
      <footer><span>Inspired by Populous. Made for a moment of wonder. <span class="footer-wave">≈</span></span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
